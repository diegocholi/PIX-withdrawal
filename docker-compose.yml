x-app-base: &app-base
  image: tecnofit/pix-withdrawal:local
  build:
    context: .
    dockerfile: Dockerfile
    args:
      REDIS_EXTENSION_VERSION: 6.1.0
      RDKAFKA_EXTENSION_VERSION: 6.0.5
      SWOOLE_EXTENSION_VERSION: 5.1.5
  restart: unless-stopped
  working_dir: /opt/apps/pix-withdrawal
  environment:
    APP_ENV: local
    APP_DEBUG: "true"
    APP_LOG_MAX_FILES: 14
    APP_RUNTIME_UID: ${APP_RUNTIME_UID:-1000}
    APP_RUNTIME_GID: ${APP_RUNTIME_GID:-1000}
    APP_TIMEZONE: America/Sao_Paulo
    TZ: America/Sao_Paulo
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: pix_withdrawal
    DB_USERNAME: pix_withdrawal
    DB_PASSWORD: pix_withdrawal
    KAFKA_BROKERS: kafka:19092
    MAIL_HOST: mailhog
    MAIL_PORT: 1025
  depends_on:
    mysql:
      condition: service_healthy
    kafka:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
    mailhog:
      condition: service_healthy
  volumes:
    - ./:/opt/apps/pix-withdrawal
    - vendor-data:/opt/apps/pix-withdrawal/vendor
    - composer-cache:/tmp/composer
  networks:
    - pix-withdrawal
    - pix-withdrawal-public
  healthcheck:
    test:
      - CMD
      - php
      - -r
      - exit((int) (!extension_loaded('openssl') || !extension_loaded('pcntl') || !extension_loaded('pdo_mysql') || !extension_loaded('redis') || !extension_loaded('rdkafka') || !extension_loaded('sockets') || !extension_loaded('swoole') || !is_dir('runtime') || !is_dir('storage') || !is_writable('runtime') || !is_writable('storage')));
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s

services:
  app:
    <<: *app-base
    container_name: pix-withdrawal-app
    command: ["./docker/entrypoint/http.sh"]
    ports:
      - "9501:9501"

  app-cli:
    <<: *app-base
    container_name: pix-withdrawal-cli
    command: ["./docker/entrypoint/cli.sh"]
    profiles:
      - cli
    tty: true
    stdin_open: true

  app-worker-process:
    <<: *app-base
    container_name: pix-withdrawal-worker-process
    command: ["./docker/entrypoint/cli.sh", "withdraw:worker:process"]

  app-worker-notify:
    <<: *app-base
    container_name: pix-withdrawal-worker-notify
    command: ["./docker/entrypoint/cli.sh", "withdraw:worker:notify"]

  app-scheduler:
    <<: *app-base
    container_name: pix-withdrawal-scheduler
    environment:
      WITHDRAW_SCHEDULER_POLL_INTERVAL_SECONDS: ${WITHDRAW_SCHEDULER_POLL_INTERVAL_SECONDS:-5}
      WITHDRAW_SCHEDULER_BATCH_SIZE: ${WITHDRAW_SCHEDULER_BATCH_SIZE:-100}
    command: ["sh", "./docker/entrypoint/scheduler.sh"]

  mysql:
    image: mysql:8.4
    container_name: pix-withdrawal-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pix_withdrawal
      MYSQL_USER: pix_withdrawal
      MYSQL_PASSWORD: pix_withdrawal
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - pix-withdrawal
      - pix-withdrawal-public

  kafka:
    image: apache/kafka:4.2.0@sha256:9516fb7634bad307d17c33b589fde9023003b0cb761374f500002b980a3149b9
    container_name: pix-withdrawal-kafka
    restart: unless-stopped
    user: "0:0"
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-storage:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - pix-withdrawal

  kafka-init:
    image: apache/kafka:4.2.0@sha256:9516fb7634bad307d17c33b589fde9023003b0cb761374f500002b980a3149b9
    container_name: pix-withdrawal-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    command: ["sh", "/opt/bootstrap/kafka-topics-init.sh"]
    volumes:
      - ./docker/entrypoint/kafka-topics-init.sh:/opt/bootstrap/kafka-topics-init.sh:ro
    networks:
      - pix-withdrawal

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: pix-withdrawal-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/api/v2/messages >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - pix-withdrawal
      - pix-withdrawal-public

networks:
  pix-withdrawal:
    name: pix-withdrawal-network
    driver: bridge
    internal: true
  pix-withdrawal-public:
    name: pix-withdrawal-public-network
    driver: bridge

volumes:
  composer-cache:
    name: pix-withdrawal-composer-cache
    driver: local
  vendor-data:
    name: pix-withdrawal-vendor-data
    driver: local
  mysql-data:
    name: pix-withdrawal-mysql-data
    driver: local
  kafka-storage:
    name: pix-withdrawal-kafka-storage
    driver: local
